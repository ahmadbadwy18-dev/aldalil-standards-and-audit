name: Auto Fetch Tax & Accounting Updates

on:
  schedule:
    - cron: '0 0 * * 0' # يعمل تلقائياً كل يوم أصل الأسبوع
  workflow_dispatch: # يتيح لك التشغيل اليادوي في أي وقت

jobs:
  update-standards:
    runs-on: ubuntu-latest
    permissions:
      contents: write # منح صلاحية التحديث والكتابة داخل المستودع لمنع خطأ الفشل

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and Check Official Sources
        run: |
          echo "Checking official sources for updates..."
          # إدراج السكربت أو التأكد من سلامة روابط الرادار
          
      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add .
          git diff-index --quiet HEAD || git commit -m "Auto-update: Refresh tax & accounting records"
          git push
